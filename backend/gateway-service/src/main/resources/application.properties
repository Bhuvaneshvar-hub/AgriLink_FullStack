spring.application.name=gateway-service
server.port=9091

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# Resilience4j Circuit Breaker properties
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED


# Request timeout configuration
# NOTE: named "configs.*" entries only apply automatically for the "default" key;
# every other named config here was inert unless wired to its route via
# "instances.<name>.base-config" (which none of these were). Use "instances.<routeName>"
# directly instead, matching the circuitBreaker(name, ...) name used in GatewayRoutesConfig.
resilience4j.timelimiter.configs.default.timeout-duration=5s
# farmer-service self-registration makes a synchronous internal call to iam-service
# (create login account) before saving the profile, routinely taking ~2s; the old 3s
# default left almost no margin, so slow requests hit the gateway timeout and returned
# a false "service unavailable" to the browser even though the registration succeeded.
resilience4j.timelimiter.instances.farmerServiceCircuit.timeout-duration=10s
resilience4j.timelimiter.instances.iamServiceCircuit.timeout-duration=10s
resilience4j.timelimiter.instances.reportServiceCircuit.timeout-duration=10s

# Logging configuration
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.org.springframework.web.servlet.function=DEBUG



